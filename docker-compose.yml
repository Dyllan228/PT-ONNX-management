version: '3.8'

services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pt-onnx-benchmark
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
